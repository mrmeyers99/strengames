# Tests, then pushes src/ to the bound Apps Script project and publishes a new version
# of the existing web-app deployment (same /exec URL).
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', '.clasp.json', '.github/workflows/deploy.yml', '.github/workflows/test.yml']
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

env:
  DEPLOYMENT_ID: AKfycbyYQTpEqrMEP4LcEhUI-uY_RgkAfv49P2YbAULIjaBz3WSJGySrx4PdnCk13IPNm9y3Uw

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install -g @google/clasp@2.4.2
      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Add the CLASPRC_JSON repository secret (see README)"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
      - name: Push code
        run: clasp push --force
      - name: Publish new version to the web app
        run: |
          clasp deploy -i "$DEPLOYMENT_ID" -d "${GITHUB_SHA::7} $(git log -1 --format=%s | cut -c1-80)"
