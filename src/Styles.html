<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Volkhov:ital,wght@0,400;0,700;1,400&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  /* Palette taken from strenuouslife.co: forest green #053121, gold #c89247, charcoal #252e2a */
  :root {
    --green: #053121;
    --green-2: #0b4632;
    --green-3: #1d5a43;
    --gold: #c89247;
    --gold-2: #e0b26f;
    --gold-soft: #f3e4c8;
    --ink: #252e2a;
    --ink-2: #4c5650;
    --muted: #7a817c;
    --paper: #f7f2e7;
    --card: #fffdf8;
    --line: #e3d9c4;
    --ok: #2f7a4b;
    --warn: #b5651d;
    --bad: #a8322b;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(5, 49, 33, .08), 0 6px 18px rgba(5, 49, 33, .07);
    --display: 'Volkhov', Georgia, 'Times New Roman', serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --cond: 'Barlow Condensed', 'Barlow', sans-serif;
    --poster: 'Bebas Neue', 'Barlow Condensed', Impact, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    background-image: radial-gradient(rgba(200,146,71,.07) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--green-3); }
  button { font: inherit; }

  /* ---------- header ---------- */
  .masthead {
    background: var(--green);
    color: var(--gold-soft);
    border-bottom: 4px solid var(--gold);
    position: relative;
  }
  .masthead::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 2px; background: var(--gold); opacity: .55;
  }
  .masthead-inner { max-width: 880px; margin: 0 auto; padding: 18px 16px 14px; display: flex; gap: 14px; align-items: center; }
  .emblem { width: 58px; height: 58px; flex: none; }
  .titles { min-width: 0; }
  .kicker { font-family: var(--cond); letter-spacing: .18em; text-transform: uppercase; font-size: 12px; color: var(--gold); }
  .season-name { font-family: var(--poster); font-weight: 400; font-size: 38px; letter-spacing: .02em; line-height: 1; color: #fff; margin: 2px 0 0; }
  .tagline { font-family: var(--poster); color: var(--gold); font-size: 20px; letter-spacing: .04em; line-height: 1; }
  .season-dates { font-size: 13px; color: var(--gold-soft); opacity: .85; }
  .mast-moose { height: 118px; width: auto; margin: -10px 0 -18px auto; align-self: flex-end; pointer-events: none; }
  .mast-moose + .whoami { margin-left: 8px; }
  .whoami { margin-left: auto; text-align: right; font-size: 13px; }
  .whoami button { background: transparent; color: var(--gold-2); border: 1px solid rgba(200,146,71,.55); border-radius: 999px; padding: 6px 12px; cursor: pointer; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .whoami button:hover { background: rgba(200,146,71,.15); }

  nav.tabs { max-width: 880px; margin: 0 auto; display: flex; gap: 2px; padding: 0 8px; overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    background: transparent; border: 0; color: var(--gold-soft); opacity: .75; padding: 10px 12px 12px; cursor: pointer;
    font-family: var(--cond); font-weight: 600; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
    border-bottom: 3px solid transparent;
  }
  nav.tabs button[aria-selected="true"] { opacity: 1; color: #fff; border-bottom-color: var(--gold); }

  main { max-width: 880px; margin: 0 auto; padding: 26px 16px 60px; }
  .view[hidden] { display: none !important; }

  /* ---------- quote ---------- */
  .quote { margin: 0 0 22px; padding: 14px 18px; border-left: 3px solid var(--gold); background: rgba(200,146,71,.08); border-radius: 0 var(--radius) var(--radius) 0; }
  .quote p { margin: 0; font-family: var(--display); font-style: italic; font-size: 17px; color: var(--green); }
  .quote cite { display: block; margin-top: 6px; font-style: normal; font-family: var(--cond); letter-spacing: .12em; text-transform: uppercase; font-size: 12px; color: var(--ink-2); }

  /* ---------- type ---------- */
  h2 { font-family: var(--poster); font-weight: 400; letter-spacing: .02em; color: var(--green); font-size: 34px; line-height: 1.05; margin: 0 0 4px; }
  h3 { font-family: var(--cond); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 14px; color: var(--green-3); margin: 0 0 8px; }
  .lede { color: var(--ink-2); margin: 0 0 18px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .rule { height: 1px; background: var(--line); margin: 22px 0; border: 0; }

  /* ---------- cards ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
  .card.compact { padding: 14px 16px; }
  .task { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; }
  .task .label { font-weight: 600; font-size: 17px; }
  .task .hint { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .task .pts { font-family: var(--cond); font-weight: 700; color: var(--gold); font-size: 15px; letter-spacing: .05em; white-space: nowrap; }
  .task .control { grid-column: 1 / -1; }
  .task.once-earned .pts::after { content: ' \2713'; color: var(--ok); }

  /* ---------- banners ---------- */
  .banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); margin-bottom: 16px; font-size: 15px; border: 1px solid; }
  .banner.open { background: #eaf3ec; border-color: #bcd9c4; color: #1f5133; }
  .banner.upcoming { background: var(--gold-soft); border-color: #e4c891; color: #6b4a17; }
  .banner.closed { background: #f6e5e3; border-color: #e5bcb7; color: #7d2620; }
  .banner.late { background: #fbeedd; border-color: #ecc797; color: #7a4a12; }
  .banner b { font-weight: 700; }

  /* ---------- forms ---------- */
  label.field { display: block; margin-bottom: 14px; }
  label.field > span { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=number], input[type=search] {
    width: 100%; padding: 11px 12px; border: 1px solid #cfc4ad; border-radius: 8px; background: #fff; color: var(--ink);

  }
  input:focus-visible, button:focus-visible { outline: 3px solid rgba(200,146,71,.55); outline-offset: 1px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; border: 1px solid var(--green);
    background: var(--green); color: #fff; padding: 12px 20px; cursor: pointer; font-family: var(--cond); font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; font-size: 15px;
  }
  .btn:hover { background: var(--green-2); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--green); }
  .btn.gold:hover { background: var(--gold-2); }
  .btn.ghost { background: transparent; color: var(--green); }
  .btn.ghost:hover { background: rgba(5,49,33,.06); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn.block { width: 100%; }

  /* day pips */
  .pips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pip {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid #cfc4ad; background: #fff; color: var(--ink-2); cursor: pointer;
    font-family: var(--cond); font-weight: 700; font-size: 13px; display: grid; place-items: center; padding: 0;
  }
  .pip.on { background: var(--green); border-color: var(--green); color: var(--gold-2); }
  .pip.zero { width: auto; padding: 0 12px; border-radius: 999px; }
  .pip.zero.on { background: var(--ink-2); border-color: var(--ink-2); color: #fff; }
  .pips .count { margin-left: 6px; font-family: var(--cond); font-weight: 700; color: var(--green); }

  /* yes/no */
  .yesno { display: inline-flex; border: 1px solid #cfc4ad; border-radius: 999px; overflow: hidden; background: #fff; }
  .yesno button { border: 0; background: transparent; padding: 9px 18px; cursor: pointer; font-family: var(--cond); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 14px; color: var(--ink-2); }
  .yesno button.on[data-v="yes"] { background: var(--green); color: var(--gold-2); }
  .yesno button.on[data-v="no"] { background: #ece5d6; color: var(--ink); }

  /* week chips */
  .weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .week-chip { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 11px; cursor: pointer; }
  .week-chip .wk { font-family: var(--cond); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--green); }
  .week-chip .st { font-size: 12px; color: var(--muted); }
  .week-chip[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  .week-chip.state-open .st { color: var(--ok); }
  .week-chip.state-late .st { color: var(--warn); }
  .week-chip.state-closed .st, .week-chip.state-upcoming .st { color: var(--muted); }
  .week-chip.done .wk::after { content: ' \2713'; color: var(--ok); }

  /* tally */
  .tally { position: sticky; bottom: 0; background: var(--green); color: #fff; border-radius: var(--radius); margin: 18px 0 0; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 -6px 18px rgba(5,49,33,.18); z-index: 5; }
  .tally .num { font-family: var(--display); font-size: 26px; font-weight: 700; color: var(--gold-2); line-height: 1; }
  .tally .cap { font-family: var(--cond); letter-spacing: .12em; text-transform: uppercase; font-size: 12px; opacity: .8; }
  .tally .btn { margin-left: auto; }

  /* typeahead */
  .ta { position: relative; }
  .ta-list { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); background: #fff; border: 1px solid #cfc4ad; border-radius: 8px; box-shadow: var(--shadow); max-height: 340px; overflow-y: auto; margin: 0; padding: 4px; list-style: none; }
  .ta-list li { padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .ta-list li .b { font-weight: 700; color: var(--green); }
  .ta-list li .r { font-family: var(--cond); font-weight: 600; color: var(--gold); letter-spacing: .04em; margin-left: 4px; }
  .ta-list li .t { display: block; color: var(--ink-2); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .ta-list li.active, .ta-list li:hover { background: var(--gold-soft); }
  .ta-list li.free { border-top: 1px dashed var(--line); margin-top: 4px; }
  .ta-list .grp { font-family: var(--cond); text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--muted); padding: 6px 10px 2px; cursor: default; }
  .picked { margin-top: 10px; padding: 10px 12px; border: 1px solid #e4c891; background: #fffaf0; border-radius: 8px; font-size: 14px; }
  .picked .b { font-weight: 700; color: var(--green); }
  .picked details summary { cursor: pointer; color: var(--green-3); font-size: 13px; margin-top: 4px; }
  .note-all { font-size: 12px; color: #6b4a17; margin-top: 6px; }

  /* team picker */
  .team-list { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; margin-top: 8px; }
  .team-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid #f0e9da; cursor: pointer; }
  .team-row:last-child { border-bottom: 0; }
  .team-row input { width: 18px; height: 18px; accent-color: var(--green); }
  .team-row .n { font-weight: 600; }
  .team-row .m { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .team-row.mine { background: #f2f7f3; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: var(--green); color: var(--gold-soft); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .my-teams { display: flex; flex-direction: column; gap: 8px; }
  .my-team { display: flex; align-items: center; gap: 12px; }
  .link-btn { background: none; border: 0; padding: 4px 2px; color: var(--bad); font-size: 13px; text-decoration: underline; cursor: pointer; }
  .link-btn:hover { color: #7d2620; }
  .chip.leader::before { content: '\2605 '; color: var(--gold-2); }

  /* standings */
  .seg { display: inline-flex; border: 1px solid var(--green); border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .seg button { border: 0; background: transparent; color: var(--green); padding: 8px 16px; cursor: pointer; font-family: var(--cond); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--green); color: var(--gold-2); }
  table.board { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.board th { text-align: left; font-family: var(--cond); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid var(--line); }
  table.board td { padding: 10px 8px; border-bottom: 1px solid #efe7d6; vertical-align: top; }
  table.board td.rk { width: 44px; font-family: var(--display); font-weight: 700; color: var(--green); }
  table.board td.sc, table.board th.sc { text-align: right; font-weight: 700; }
  table.board tr.me td { background: #fff6e3; }
  table.board tr.top1 td.rk { color: var(--gold); }
  table.board tr.expandable { cursor: pointer; }
  table.board tr.members td { background: #faf6ee; font-size: 13px; color: var(--ink-2); padding-top: 4px; }
  .medal { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: var(--green); font-size: 14px; }
  .medal.s2 { background: #c9ccc9; } .medal.s3 { background: #c79a6b; }

  /* record */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat .k { font-family: var(--cond); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
  .stat .v { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--green); }
  .bigscore { display: flex; align-items: baseline; gap: 10px; }
  .bigscore .v { font-family: var(--display); font-size: 44px; font-weight: 700; color: var(--green); line-height: 1; }
  .meter { height: 8px; background: #ece5d6; border-radius: 999px; overflow: hidden; margin: 10px 0 4px; }
  .meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--green-3), var(--gold)); }

  /* rules */
  .points-table { width: 100%; border-collapse: collapse; }
  .points-table td { padding: 8px 6px; border-bottom: 1px solid #efe7d6; }
  .points-table td:last-child { text-align: right; font-family: var(--cond); font-weight: 700; color: var(--green); white-space: nowrap; }
  .rules-list li { margin-bottom: 6px; }

  /* modal */
  .modal-back { position: fixed; inset: 0; background: rgba(5,49,33,.55); display: grid; place-items: start center; padding: 8vh 16px 16px; z-index: 50; }
  .modal-back[hidden] { display: none; }
  .modal { background: var(--paper); width: 100%; max-width: 480px; border-radius: 12px; border-top: 5px solid var(--gold); box-shadow: 0 20px 60px rgba(0,0,0,.3); padding: 20px; max-height: 84vh; display: flex; flex-direction: column; }
  .people { overflow-y: auto; margin: 10px 0 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .people li button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid #f0e9da; padding: 11px 12px; cursor: pointer; }
  .people li button:hover, .people li button:focus-visible { background: var(--gold-soft); }
  .people .u { color: var(--muted); font-size: 13px; margin-left: 6px; }

  /* toast */
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(30px); opacity: 0; transition: all .25s; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 8px; z-index: 60; max-width: calc(100% - 32px); box-shadow: var(--shadow); font-size: 15px; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--bad); }

  .app-version { text-align: center; font-size: 11px; color: var(--muted); padding: 0 0 24px; opacity: .7; }
  /* TR speech bubble */
  .tr-bubble {
    position: fixed; z-index: 70; background: #fffdf8; color: var(--green); border: 2px solid var(--green);
    border-radius: 16px; padding: 9px 14px; font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1.3;
    box-shadow: 0 6px 18px rgba(5,49,33,.25); max-width: 240px; opacity: 0; transform: scale(.85); transform-origin: right center;
    transition: opacity .18s ease, transform .18s ease; pointer-events: none; visibility: hidden;
  }
  .tr-bubble.show { opacity: 1; transform: scale(1); visibility: visible; }
  .tr-bubble::after, .tr-bubble::before { content: ''; position: absolute; right: -11px; top: 14px; border: 6px solid transparent; border-left: 10px solid var(--green); border-right: 0; }
  .tr-bubble::before { right: -7px; top: 16px; border-width: 4px 0 4px 7px; border-left-color: #fffdf8; z-index: 1; }
  .tr-bubble.in-float { position: absolute; right: calc(100% - 6px); top: 4px; width: max-content; max-width: min(230px, calc(100vw - 150px)); }
  .tr-float {
    position: fixed; right: 10px; bottom: 92px; z-index: 69; width: 104px; height: 112px; pointer-events: none;
    transform: translateX(140%); transition: transform .35s ease;
  }
  .tr-float img { width: 104px; height: auto; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
  .tr-float.show { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) { .tr-bubble, .tr-float { transition: none; } }
  .loading { text-align: center; padding: 60px 0; color: var(--muted); font-family: var(--cond); letter-spacing: .14em; text-transform: uppercase; }
  .empty { text-align: center; padding: 26px; color: var(--muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; min-width: 0; }

  @media (max-width: 560px) {
    .masthead-inner { flex-wrap: wrap; padding-top: 14px; }
    .emblem { width: 46px; height: 46px; }
    .season-name { font-size: 30px; }
    .whoami, .mast-moose + .whoami { margin-left: 0; width: 100%; text-align: left; }
    .mast-moose { position: absolute; right: 10px; top: 8px; height: 92px; margin: 0; }
    .masthead-inner { position: relative; }
    .whoami button { max-width: 100%; }
    .pips { gap: 4px; }
    .pip { width: 32px; height: 32px; font-size: 12px; }
    .pip.zero { padding: 0 9px; }
    .pips .count { display: none; }
    .tally { margin: 18px -16px 0; border-radius: var(--radius) var(--radius) 0 0; }
    .hide-sm { display: none; }
    table.board td, table.board th { padding-left: 4px; padding-right: 4px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
